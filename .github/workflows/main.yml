name: Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: master

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Run all tests
        run: go test -v -race ./...

      - name: Build release binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -v -o dist/exemplar-linux-amd64 ./cmd
          GOOS=darwin GOARCH=amd64 go build -v -o dist/exemplar-darwin-amd64 ./cmd
          GOOS=windows GOARCH=amd64 go build -v -o dist/exemplar-windows-amd64.exe ./cmd

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Automated production release from main branch.
            
            Changes: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Upload Linux binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/exemplar-linux-amd64
          asset_name: exemplar-linux-amd64
          asset_content_type: application/octet-stream

      - name: Merge test to master
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin master test
          git checkout master
          git merge origin/test --no-edit
          git push origin master

      - name: Deployment complete
        run: echo "✅ Application deployed to production successfully!"
