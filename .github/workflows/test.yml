name: Testing Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Comprehensive Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Code coverage: $coverage%"
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "Coverage below 70%"
            exit 1
          fi

      - name: Run integration tests
        run: go test -v -run Integration ./...

      - name: Build application
        run: go build -v -o exemplar ./cmd

      - name: Test binary execution
        run: timeout 5 ./exemplar || true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Trigger production workflow
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git fetch origin test master
          git checkout master
          git merge origin/test --no-edit
          git push origin master
          
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/master.yml/dispatches \
            -d '{"ref":"master"}'
