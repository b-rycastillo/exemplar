name: Test Validation and Promotion

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact development commit promoted to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promoted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detection and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Require at least 70 percent coverage
        run: |
          go tool cover -func=coverage.out | awk '
            $1 == "total:" {
              coverage = $3 + 0
              print "Code coverage: " coverage "%"
              found = 1
              if (coverage < 70) exit 1
            }
            END { if (!found) exit 1 }
          '

      - name: Run API integration tests
        run: go test -v -count=1 ./internal/handler/...

      - name: Build application
        run: go build -v -o exemplar ./cmd

      - name: Verify health endpoint
        run: |
          PORT=8080 ./exemplar > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

  promote-master:
    name: Promote Test to Master
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Fast-forward master to validated test commit
        env:
          VALIDATED_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin test master
          test "$(git rev-parse origin/test)" = "$VALIDATED_SHA"
          git checkout -B master origin/master
          git merge --ff-only "$VALIDATED_SHA"
          git push origin HEAD:refs/heads/master

  release:
    name: Publish Master Release
    needs: promote-master
    permissions:
      contents: write
    uses: ./.github/workflows/master.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
