name: Master Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact tested commit promoted to master
        required: true
        type: string
      version_bump:
        description: Version increment (normal pipeline runs use patch)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: master-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify dispatch branch and commit
        env:
          EXPECTED_REF: refs/heads/master
          ACTUAL_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          VALIDATED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$ACTUAL_REF" = "$EXPECTED_REF"
          test "$DISPATCH_SHA" = "$VALIDATED_SHA"
      - name: Checkout validated master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify master matches the tested commit
        env:
          VALIDATED_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$VALIDATED_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run final tests
        run: go test -race ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -v -o dist/exemplar-linux-amd64 ./cmd
          GOOS=darwin GOARCH=amd64 go build -v -o dist/exemplar-darwin-amd64 ./cmd
          GOOS=windows GOARCH=amd64 go build -v -o dist/exemplar-windows-amd64.exe ./cmd

      - name: Choose release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: python3 .github/scripts/release_version.py

      - name: Publish release with all binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Reuse the version when retrying the same commit and repair asset uploads.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$RELEASE_TAG" /tmp/release-tags; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$VALIDATED_SHA" \
            --title "Release $RELEASE_TAG" \
            --notes "Automated release of tested master commit $VALIDATED_SHA."
