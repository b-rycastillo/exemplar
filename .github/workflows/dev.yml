name: Development Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
    types: [opened, synchronize, closed]

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out

      - name: Build application
        run: go build -v -o exemplar ./cmd

      - name: Merge to test branch
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin development test
          git checkout test
          git merge origin/development --no-edit
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git test

      - name: Trigger test workflow
        if: success()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/test.yml/dispatches \
            -d '{"ref":"test"}'
