name: Development CI and Promotion

on:
  push:
    branches: [development]

permissions:
  contents: read

# Serialize the full promotion chain; never cancel a running promotion.
concurrency:
  group: development-promotion
  cancel-in-progress: false

jobs:
  validate:
    name: Run Tests and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build application
        run: go build -v -o exemplar ./cmd

  promote-test:
    name: Promote Development to Test
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fast-forward test to validated commit
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          git fetch origin test
          git checkout -B test origin/test
          git merge --ff-only "$VALIDATED_SHA"
          git push origin HEAD:refs/heads/test

  testing:
    name: Test and Promote to Master
    needs: promote-test
    permissions:
      contents: write
    uses: ./.github/workflows/test.yml
    with:
      commit_sha: ${{ github.sha }}
